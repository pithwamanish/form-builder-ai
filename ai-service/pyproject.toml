[project]
name = "ai-form-service"
version = "1.0.0"
description = "FastAPI AI Layer for Laravel Form Builder"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "requests>=2.31.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.1",
    "instructor>=1.3.0",
    "litellm>=1.35.0",
]
readme = "README.md"
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
